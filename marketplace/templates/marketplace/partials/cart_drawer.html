<div class="flex min-h-full flex-col" x-data>
    <div class="mb-2 flex items-center justify-between">
        <h2 class="text-lg font-semibold tracking-tight">
            Your cart
            <span class="text-base-content/50 font-normal" x-show="$store.cart.count > 0" x-cloak x-text="'(' + $store.cart.count + ')'"></span>
        </h2>
        <label for="cart-drawer" class="btn btn-ghost btn-sm btn-circle" aria-label="Close cart">✕</label>
    </div>

    <template x-if="!$store.cart.isEmpty">
        <div class="flex min-h-0 flex-1 flex-col">
            <ul class="divide-base-300 flex-1 divide-y">
                <template x-for="item in $store.cart.items" :key="item.id">
                    <li class="flex gap-3 py-4">
                        <a :href="item.url || null" class="product-image-well size-16 shrink-0 p-1">
                            <img
                                x-show="item.imageUrl"
                                class="max-h-full max-w-full object-contain"
                                :src="item.imageUrl"
                                :alt="item.name"
                                width="64"
                                height="64"
                            />
                            <span x-show="!item.imageUrl" class="product-image-well__empty text-xs">—</span>
                        </a>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-start justify-between gap-2">
                                <a :href="item.url || null" class="line-clamp-2 text-sm font-medium leading-snug hover:underline" x-text="item.name"></a>
                                <p class="shrink-0 text-sm font-semibold">$<span x-text="$store.cart.lineTotal(item)"></span></p>
                            </div>
                            <p class="mt-0.5 text-xs text-base-content/55">
                                <span x-show="item.variantLabel" x-text="item.variantLabel" x-cloak></span>
                                <span x-show="item.variantLabel" aria-hidden="true"> · </span>
                                $<span x-text="item.price"></span> each
                            </p>
                            <div class="mt-2 flex items-center justify-between gap-2">
                                <div class="mp-qty mp-qty--sm" role="group" :aria-label="'Quantity for ' + item.name">
                                    <button
                                        type="button"
                                        class="mp-qty__btn"
                                        :aria-label="item.quantity > 1 ? 'Decrease quantity' : 'Remove ' + item.name"
                                        @click="$store.cart.setQuantity(item.id, Number(item.quantity) - 1)"
                                    >−</button>
                                    <span class="mp-qty__value" x-text="item.quantity"></span>
                                    <button
                                        type="button"
                                        class="mp-qty__btn"
                                        aria-label="Increase quantity"
                                        :disabled="Number(item.quantity) >= Number(item.maxQty || 99)"
                                        @click="$store.cart.setQuantity(item.id, Number(item.quantity) + 1)"
                                    >+</button>
                                </div>
                                <button
                                    type="button"
                                    class="btn btn-ghost btn-xs text-base-content/60"
                                    @click="$store.cart.remove(item.id)"
                                >
                                    Remove
                                </button>
                            </div>
                        </div>
                    </li>
                </template>
            </ul>
            <div class="border-base-300 bg-base-100 sticky bottom-0 mt-4 border-t pt-4 pb-2">
                <div class="flex items-baseline justify-between">
                    <span class="text-sm text-base-content/70">Subtotal</span>
                    <span class="text-lg font-semibold">$<span x-text="$store.cart.subtotal"></span></span>
                </div>
                <p class="mt-1 text-xs text-base-content/50">Delivery calculated at checkout.</p>
                <button type="button" class="btn btn-primary btn-block mt-4 rounded-full" disabled>
                    Checkout coming soon
                </button>
                <label for="cart-drawer" class="btn btn-ghost btn-block btn-sm mt-2 rounded-full">Continue shopping</label>
            </div>
        </div>
    </template>

    <template x-if="$store.cart.isEmpty">
        <div class="flex flex-1 flex-col items-center justify-center py-12 text-center">
            <span class="mp-empty__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 8H6" />
                    <circle cx="9" cy="20" r="1" fill="currentColor" stroke="none" />
                    <circle cx="17" cy="20" r="1" fill="currentColor" stroke="none" />
                </svg>
            </span>
            <p class="mt-3 font-medium">Your cart is empty</p>
            <p class="mt-1 text-sm text-base-content/60">Discover products from Zimbabwean makers.</p>
            <a href="{% url 'marketplace:index' %}" class="btn btn-primary btn-sm mt-5 rounded-full">Browse marketplace</a>
        </div>
    </template>
</div>
