<section class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body gap-6">
        <div>
            <h2 class="text-lg font-semibold">Your details</h2>
            <p class="mt-1 text-sm text-base-content/60">We’ll use this to confirm your order and contact you about fulfilment.</p>
        </div>

        {% include "marketplace/checkout/partials/form_errors.html" %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-control w-full">
                <label class="label py-1" for="{{ field.id_for_label }}">
                    <span class="label-text">{{ field.label }}</span>
                </label>
                {{ field }}
                {% if field.errors %}
                <p class="text-error mt-1 text-sm" id="{{ field.id_for_label }}-error">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex flex-col gap-3 pt-2 sm:flex-row sm:justify-between">
                <button type="submit" name="action" value="back" class="btn btn-ghost rounded-full">Back</button>
                <button type="submit" class="btn btn-primary rounded-full">Continue to delivery</button>
            </div>
        </form>
    </div>
</section>
