server {
    listen 80;
    server_name _;

    # Disable server tokens for security
    server_tokens off;

    # Volume mounts land at /var/www/static and /var/www/media. Use `root`
    # (not `alias` + `try_files`) — alias/try_files together commonly 404s
    # every asset, which is why production looked unstyled while local :8002
    # (Django serving static) looked fine.
    root /var/www;

    # Compress text assets. Static CSS/JS is the bulk of a page load here.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Requests arrive via Traefik, so nginx sees them as proxied.
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /static/ {
        # ManifestStaticFilesStorage fingerprints filenames; long cache is safe.
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # nginx only serves static/media — app traffic goes to the web container
    location / {
        return 404;
    }
}
