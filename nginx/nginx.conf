server {
    listen 80;
    server_name _;

    # Disable server tokens for security
    server_tokens off;

    # Compress text assets. Static CSS/JS is the bulk of a page load here, and
    # these files are served uncompressed otherwise (daisyui.css alone is 1.1MB).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # Requests arrive via Traefik, so nginx sees them as proxied.
    gzip_proxied any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Serve static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        
        # Try to serve the file, return 404 if not found
        try_files $uri =404;
    }

    # Serve media files
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        
        # Try to serve the file, return 404 if not found
        try_files $uri =404;
    }

    # Return 404 for any other paths (nginx only serves static/media)
    location / {
        return 404;
    }
}
