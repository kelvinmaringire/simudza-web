<div class="form-control w-full" x-data="{ showPassword: false }">
    <span class="label">
        <span class="label-text">{{ label }}</span>
    </span>
    <label class="input input-bordered flex w-full items-center gap-2{% if field.errors %} input-error{% endif %}">
        <input
            :type="showPassword ? 'text' : 'password'"
            name="{{ field.html_name }}"
            id="{{ field.id_for_label }}"
            value="{{ field.value|default:'' }}"
            autocomplete="{{ autocomplete|default:'current-password' }}"
            {% if required %}required{% endif %}
            placeholder="{{ placeholder|default:'' }}"
            class="grow"
        />
        <button
            type="button"
            class="btn btn-ghost btn-xs btn-square"
            @click="showPassword = !showPassword"
            :aria-label="showPassword ? 'Hide password' : 'Show password'"
        >
            <svg
                x-show="!showPassword"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                aria-hidden="true"
            >
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </g>
            </svg>
            <svg
                x-show="showPassword"
                x-cloak
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                class="h-5 w-5"
                aria-hidden="true"
            >
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.4 3.4"></path>
                    <path d="M6.1 6.1A18.2 18.2 0 0 0 2 12s3.5 7 10 7a10.3 10.3 0 0 0 4.3-.9"></path>
                </g>
            </svg>
        </button>
    </label>
    {% if field.errors %}
        <span class="label">
            <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
        </span>
    {% endif %}
    {% if help_text %}
        <span class="label">
            <span class="label-text-alt opacity-70">{{ help_text|striptags }}</span>
        </span>
    {% endif %}
</div>
