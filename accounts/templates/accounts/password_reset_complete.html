{% extends "base.html" %}

{% block title %}Password updated{% endblock %}

{% block body_class %}template-accounts-password-reset-complete{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-10 text-center">
    <h1 class="text-2xl font-semibold">Password updated</h1>
    <p class="mt-4 text-sm opacity-70">
        Your password has been set. You can now sign in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-sm mt-6">Sign in</a>
</div>
{% endblock %}
