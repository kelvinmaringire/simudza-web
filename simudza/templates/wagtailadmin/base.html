{% extends "wagtailadmin/base.html" %}
{% load static %}

{% block branding_logo %}
    <img
        class="simudza-branding-logo"
        src="{% static 'assets/logo.svg' %}"
        alt="Simudza"
        width="140"
        height="32"
        decoding="async"
    />
    <img
        class="simudza-branding-favicon"
        src="{% static 'assets/favicon.svg' %}"
        alt="Simudza"
        width="28"
        height="28"
        decoding="async"
    />
{% endblock %}
