{% if videos %}
    <section aria-labelledby="{{ section_id|default:'videos' }}">
        <h2 id="{{ section_id|default:'videos' }}" class="text-base font-semibold tracking-tight">Videos</h2>
        <ul class="mt-3 grid gap-5 sm:grid-cols-2">
            {% for video in videos %}
                <li class="min-w-0">
                    <div class="aspect-video w-full overflow-hidden rounded-box bg-base-200">
                        <iframe
                            class="h-full w-full"
                            src="{{ video.embed_url }}"
                            title="{{ video.display_title }}"
                            loading="lazy"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen
                        ></iframe>
                    </div>
                    <p class="mt-2 text-sm font-medium text-base-content">{{ video.display_title }}</p>
                    <p class="mt-0.5 flex flex-wrap items-center gap-x-1.5 text-xs text-base-content/55">
                        {% if video.title %}
                            <span>{{ video.get_kind_display }}</span>
                            <span class="text-base-content/25" aria-hidden="true">·</span>
                        {% endif %}
                        <a
                            href="{{ video.watch_url }}"
                            class="link link-hover"
                            rel="noopener noreferrer"
                            target="_blank"
                        >Watch on YouTube</a>
                    </p>
                </li>
            {% endfor %}
        </ul>
    </section>
{% endif %}
