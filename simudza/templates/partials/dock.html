{# Bottom dock: primary site navigation — keep above page drawers (filters, etc.) #}
<nav class="dock dock-md bg-base-300 border-base-400 z-50 border-t" aria-label="Main">
    <a
        href="/"
        {% if request.path == "/" %}class="dock-active"{% endif %}
        aria-label="Homepage"
    >
        <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt">
                <polyline points="1 11 12 2 23 11" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="2"></polyline>
                <path d="m5,13v7c0,1.105.895,2,2,2h10c1.105,0,2-.895,2-2v-7" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></path>
                <line x1="12" y1="22" x2="12" y2="18" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></line>
            </g>
        </svg>
        <span class="dock-label">Home</span>
    </a>

    <a
        href="{% url 'directory:index' %}"
        {% if request.resolver_match and request.resolver_match.namespace == "directory" %}class="dock-active"{% endif %}
        aria-label="Directory"
    >
        <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="currentColor" stroke-linejoin="miter" stroke-linecap="butt">
                <polyline points="3 14 9 14 9 17 15 17 15 14 21 14" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="2"></polyline>
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2"></rect>
            </g>
        </svg>
        <span class="dock-label">Directory</span>
    </a>

    <a
        href="{% url 'businesses:index' %}"
        {% if request.resolver_match and request.resolver_match.namespace == "businesses" %}class="dock-active"{% endif %}
        aria-label="Companies"
    >
        <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2">
                <path d="M3 21h18"></path>
                <path d="M5 21V7l7-4 7 4v14"></path>
                <path d="M9 21v-6h6v6"></path>
                <path d="M9 10h.01"></path>
                <path d="M15 10h.01"></path>
                <path d="M9 14h.01"></path>
                <path d="M15 14h.01"></path>
            </g>
        </svg>
        <span class="dock-label">Companies</span>
    </a>

    <a
        href="{% url 'marketplace:index' %}"
        {% if request.resolver_match and request.resolver_match.namespace == "marketplace" %}class="dock-active"{% endif %}
        aria-label="Marketplace"
    >
        <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2">
                <circle cx="9" cy="20" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="17" cy="20" r="1" fill="currentColor" stroke="none"></circle>
                <path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 2-1.5L21 8H6"></path>
            </g>
        </svg>
        <span class="dock-label">Marketplace</span>
    </a>

    {% if user.is_authenticated %}
        <a
            href="{% url 'accounts:dashboard' %}"
            {% if request.resolver_match and request.resolver_match.url_name == "dashboard" %}class="dock-active"{% endif %}
            aria-label="Account"
        >
            <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                </g>
            </svg>
            <span class="dock-label">Account</span>
        </a>
    {% else %}
        <a
            href="{% url 'accounts:login' %}"
            {% if request.resolver_match and request.resolver_match.namespace == "accounts" %}class="dock-active"{% endif %}
            aria-label="Sign in"
        >
            <svg class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="10" stroke-width="2">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"></path>
                </g>
            </svg>
            <span class="dock-label">Sign in</span>
        </a>
    {% endif %}
</nav>
